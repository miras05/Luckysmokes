<!DOCTYPE html>
<html lang="en">
<head>

  <title>Thank you for your order!</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      max-width: 500px;
    }
    h1 {
      color: #4CAF50;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.1em;
      margin-bottom: 30px;
    }
    a {
      text-decoration: none;
      background: #4CAF50;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
    }
    a:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Thank you for your order! 🎉</h1>
    <p>Your payment was successful. We'll send you a tracking number on your email</p>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shipping Details</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 50px auto; }
    label { display: block; margin-top: 15px; }
    input, select { width: 100%; padding: 8px; margin-top: 5px; }
    button { margin-top: 20px; padding: 10px 20px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h2>Shipping Details</h2>

  <form id="shipping-form">
    <label>
      <input type="radio" name="delivery" value="delivery" checked> Delivery
    </label>
    <label>
      <input type="radio" name="delivery" value="pickup"> Pickup
    </label>

    <div id="address-fields">
      <label>Full Name</label>
      <input type="text" name="name" required>

      <label>Address</label>
      <input type="text" name="address" required>

      <label>City</label>
      <input type="text" name="city" required>

      <label>State</label>
      <input type="text" name="state" required>

      <label>ZIP Code</label>
      <input type="text" name="zip" required>
    </div>

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Phone Number</label>
    <input type="tel" name="phone" required>

    <button type="submit">Continue to Payment</button>
  </form>

  <!-- <div id="shipping-summary" class="hidden">
    <h3>Summary</h3>
    <p id="shipping-cost"></p>
    <p id="shipping-days"></p>
    <button id="pay-button">Pay Now</button>
  </div> -->

  <script src="./supabase/functions/create-checkout-session/shipping.js"></script>
</body>
</html>
